name: Tests
on: [push, pull_request]
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Verify subtitle rendering support
        run: python -c 'import subprocess; r = subprocess.run(["ffmpeg", "-hide_banner", "-filters"], capture_output=True, text=True, check=True); assert any(line.split()[1:2] == ["subtitles"] for line in r.stdout.splitlines()), "FFmpeg must include the libass subtitles filter"'
      - run: python -m pip install '.[dev,tray,sonos]'
      - run: python -m coverage run --source=mkchromecast -m unittest discover -s tests
      - run: python -m coverage report
      - run: python -m ruff check .
      - run: python -m build
      - name: Test installed wheel outside source checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-test"
          "$RUNNER_TEMP/wheel-test/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-test/bin/mkchromecast" --help
          "$RUNNER_TEMP/wheel-test/bin/mkchromecast" --version
          "$RUNNER_TEMP/wheel-test/bin/python" -c 'import mkchromecast.getch'
  wayland-bindings:
    runs-on: ubuntu-latest
    env:
      MKCHROMECAST_REQUIRE_GI: '1'
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-gi python3-venv gir1.2-glib-2.0
      - run: /usr/bin/python3 -m venv --system-site-packages .venv
      - run: .venv/bin/pip install '.[dev]'
      - run: .venv/bin/python -m unittest discover -s tests
