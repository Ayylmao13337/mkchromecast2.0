[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mkchromecast"
dynamic = ["version"]
description = "Cast Linux and macOS audio and video to Google Cast devices"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Muammar El Khatib and contributors"}]
dependencies = [
    "Flask>=3.1,<4", "psutil>=5.9,<8", "PyChromecast>=14.0.10,<15",
    "requests>=2.32,<3", "packaging>=24",
]

[project.optional-dependencies]
tray = ["PyQt5>=5.15.11,<6"]
wayland = ["PyGObject>=3.46; sys_platform == 'linux'"]
sonos = ["soco>=0.30,<1"]
youtube = ["yt-dlp[default]>=2026.3.3"]
dev = ["coverage>=7.6", "build>=1.2", "ruff>=0.9"]

[project.scripts]
mkchromecast = "mkchromecast.cli:main"

[project.urls]
Repository = "https://github.com/Ayylmao13337/mkchromecast2.0"
Issues = "https://github.com/Ayylmao13337/mkchromecast2.0/issues"

[tool.setuptools.dynamic]
version = {attr = "mkchromecast.version.__version__"}

[tool.setuptools.packages.find]
include = ["mkchromecast*"]

[tool.setuptools.package-data]
mkchromecast = ["resources/*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F821", "F823"]
